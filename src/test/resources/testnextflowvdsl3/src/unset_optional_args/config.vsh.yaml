name: unset_optional_args
arguments:
  - name: "--given"
    type: string
  - name: "--optional_unset"
    type: string
  - name: "--with_default"
    type: string
    default: foo
  - name: "--optional_file"
    type: file
  - name: "--output"
    type: file
    required: true
    direction: output
resources:
  - type: bash_script
    path: script.sh
engines:
  - type: native
  - type: docker
    image: nextflow/bash:latest
runners:
  - type: nextflow
