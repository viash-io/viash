name: Scala CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'develop_**'

jobs:
  scala-ci:
    runs-on: ${{ matrix.config.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: 'ubuntu_latest', os: ubuntu-latest }
          - { name: 'macos_latest', os: macos-latest }
        java:
          - { ver: '11', run_nextflow: true, run_coverage: false, nxf_ver: "22.04.5" }
          - { ver: '17', run_nextflow: true, run_coverage: true, nxf_ver: latest }
          - { ver: '21', run_nextflow: true, run_coverage: false, nxf_ver: latest-edge }

    steps:
    - uses: actions/checkout@v7

    - uses: viash-io/viash-actions/project/update-docker-engine@v6
      if: runner.os == 'Linux'

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - name: Set up R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          processx
          testthat

    - name: Set up java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ matrix.java.ver }}

    - name: Set up sbt
      uses: sbt/setup-sbt@v1

    - name: Set up Scala (via Coursier)
      uses: coursier/setup-action@v3
      with:
        apps: scala:3.6.2 bloop

    - name: Warm up scala
      run: |
        # start the bloop server, it'll download a lot of dependencies, so do it early
        # also we need to start it before running any scala code, otherwise it will often timeout and cause the whole job to fail
        bloop server &
        for i in $(seq 1 30); do
          timeout 5 bloop about 2>/dev/null && echo "Bloop is ready!" && break
          echo "Waiting for Bloop... ($i/30)"
          sleep 2
        done

        scala -version
        scala -e 'println("Hello, Scala!")'

    - name: Set up .NET SDK
      if: ${{ runner.os == 'Linux' }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '9.0.x'

    - name: Set up dotnet-script
      if: ${{ runner.os == 'Linux' }}
      run: dotnet tool install -g dotnet-script

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Set up Nextflow
      if: ${{ runner.os == 'Linux' && matrix.java.run_nextflow }}
      uses: nf-core/setup-nextflow@v3
      with:
        version: ${{ matrix.java.nxf_ver }}

    - name: Run tests
      env:
        NXF_SYNTAX_PARSER: v1
      run: |
        # TEMPORARY: only run the Nextflow runner suites that exercise safeJoin()'s
        # join path, to speed up CI while iterating on the safeJoin() race condition
        # fix. Revert this step to the full suite before merging.
        if [[ "${{ matrix.config.os }}" =~ ^macos.*$ ]]; then
          # macOS on github actions does not have Docker, so these suites can't run there
          echo "Skipping tests on macOS (temporary CI speed-up, no Docker available)"
        else
          sbt 'testOnly io.viash.runners.nextflow.NextflowScriptTest io.viash.runners.nextflow.WorkflowHelperTest io.viash.runners.nextflow.Vdsl3ModuleTest io.viash.runners.nextflow.Vdsl3StandaloneTest io.viash.runners.nextflow.functions.NextflowHelperFunctionTest'
        fi

    - name: Upload coverage on success
      run: bash <(curl -s https://codecov.io/bash)

    - name: Upload check results on fail
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.config.name }}_results
        path: check
